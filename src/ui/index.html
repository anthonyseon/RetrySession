<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RetrySession — 세션 감시·재시작</title>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/fold.css">
</head>
<body>

<header>
  <h1>RetrySession <small id="acct">계정 확인 중…</small></h1>
  <div class="spacer"></div>
  <span class="live"><i class="dot off" id="dot"></i><span id="freshness">연결 중…</span></span>
  <button type="button" class="sm" id="btnAuto">자동갱신 켬</button>
  <button type="button" class="sm" id="btnRefresh">지금 갱신</button>
  <button type="button" class="sm" id="btnTheme">밝게</button>
  <button type="button" class="sm" id="btnSetup" aria-haspopup="dialog">설정</button>
</header>

<!-- ── PC 설정 모달 ──
     🔴 여기서 하는 일은 **남의 PC 전원 설정을 바꾸는 것**이다. 그래서 요약에
        곁들이지 않고 자기 창을 준다 — 무엇을 바꾸는지, 되돌릴 수 있는지를
        한 화면에서 다 보여줘야 사람이 누를 수 있다.
     backdrop 을 눌러도, Esc 를 눌러도 닫힌다(모달은 사라져야 한다 — 트레이
     메뉴에서 배운 것과 같다). -->
<div class="modal hide" id="setupWrap" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
  <div class="sheet">
    <div class="sheet-hd">
      <h2 id="setupTitle">PC 설정</h2>
      <span class="spacer"></span>
      <button type="button" class="sm" id="btnSetupClose" aria-label="닫기">✕</button>
    </div>
    <div class="sheet-bd" id="setupBody"></div>
    <div class="sheet-ft" id="setupFoot"></div>
  </div>
</div>

<!-- 🔴 경보는 접히는 묶음 바깥이다. 접은 채로 '감시 끊김'이 숨으면 안 된다. -->
<div class="alerts-wrap">
  <section id="alerts" class="alerts hide"></section>
</div>

<!-- 요약 열 개 항목을 한 묶음으로. 머리 띠가 곧 숨김/표시 단추다. -->
<button type="button" class="sumbar" id="btnTop" aria-expanded="true" aria-controls="top"
        title="요약을 접으면 세션과 상세가 넓어집니다">
  <span class="chev" id="btnTopIc" aria-hidden="true">▾</span>
  <span class="nm" id="btnTopTx">요약 접기</span>
  <span class="sumdigest" id="sumdigest"></span>
</button>

<div class="top" id="top">
  <section class="groups" id="tiles"></section>
</div>

<main>
  <section class="panel">
    <h2>세션 <span id="scount" class="badge off"><span class="ic">●</span>—</span>
      <span class="spacer"></span>
      <label class="filter">
        <input type="checkbox" id="onlyReg"> 등록된 것만
      </label>
    </h2>
    <div class="actions">
      <span class="n" id="selN">0개 선택</span>
      <button type="button" class="sm primary" data-act="watch-on">감시 시작</button>
      <button type="button" class="sm" data-act="watch-off">감시 중지</button>
      <button type="button" class="sm primary" data-act="resume-on">재시작 시작</button>
      <button type="button" class="sm" data-act="resume-off">재시작 중지</button>
      <button type="button" class="sm" data-act="rearm">차단 해제</button>
      <button type="button" class="sm danger" data-act="remove">등록 해제</button>
    </div>
    <div id="folders" class="folders hide"></div>
    <div id="slist"></div>
  </section>

  <section class="panel" id="detail">
    <h2 id="dtitle">상세 — 왼쪽에서 세션을 고르세요</h2>
    <div class="tabs" id="dtabs">
      <button type="button" data-tab="now" class="on">처리 상황</button>
      <button type="button" data-tab="tl">대화·도구</button>
      <button type="button" data-tab="hb">감시 로그</button>
      <button type="button" data-tab="rs">재시작 로그</button>
      <button type="button" data-tab="cfg">설정</button>
      <button type="button" data-tab="al">알림</button>
    </div>
    <!-- 상세 전용 스크롤 영역. 세션 목록(#slist)과 독립으로 움직인다. -->
    <div id="dscroll">
      <div class="empty" id="dempty">세션 행을 누르면 처리 상황과 내용이 실시간으로 표시됩니다.</div>
      <div id="dbody" class="hide">
        <div id="tab-now" class="pad"></div>
        <div id="tab-tl" class="tl hide"></div>
        <pre id="tab-hb" class="log hide"></pre>
        <!-- 재시작 탭 = 지금 판정 + 기록. "왜 안 도나"가 로그보다 위에 있어야 한다. -->
        <div id="tab-rs" class="hide">
          <div id="rsGate" class="pad"></div>
          <pre id="rsLog" class="log"></pre>
        </div>
        <div id="tab-cfg" class="pad hide"></div>
      </div>
      <!-- 알림은 세션을 고르지 않아도 볼 수 있어야 한다 — dbody 바깥에 둔다 -->
      <pre id="tab-al" class="log hide"></pre>
    </div>
  </section>
</main>

<!-- type="module" — app.js 가 summary/list/detail/common 을 import 한다.
     번들러는 쓰지 않는다(의존성 0). 브라우저가 직접 불러온다. -->
<script type="module" src="/app.js"></script>
</body>
</html>
