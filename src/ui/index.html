<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RetrySession — 세션 감시·재시작</title>
<style>
/* ── 색: 검증된 기본 팔레트. 상태색은 고정이고 테마를 따르지 않는다.
      상태색은 반드시 아이콘+라벨과 함께 쓴다 — 색만으로 뜻을 나르지 않는다. ── */
:root{
  color-scheme: light;
  --plane:#f9f9f7; --surface:#fcfcfb; --surface-2:#f2f1ed;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --base:#c3c2b7; --ring:rgba(11,11,11,.10);
  --accent:#2a78d6; --accent-track:#cde2fb;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-ink:#006300;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#222221;
  --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --base:#383835; --ring:rgba(255,255,255,.10);
  --accent:#3987e5; --accent-track:#184f95;
  --good-ink:#0ca30c;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#222221;
    --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --base:#383835; --ring:rgba(255,255,255,.10);
    --accent:#3987e5; --accent-track:#184f95; --good-ink:#0ca30c;
  }
}
*{box-sizing:border-box}

/* ── 틀: 화면 높이에 고정한다 ──
   목록과 상세가 **각각** 스크롤되려면 페이지 전체가 스크롤되면 안 된다.
   body 를 뷰포트 높이에 묶고, 남는 공간을 main 이 가져가고, 그 안에서
   각 패널이 자기 스크롤 영역을 갖는다. */
html, body{height:100%}
body{
  margin:0; background:var(--plane); color:var(--ink);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
a{color:var(--accent)}
.hide{display:none !important}

/* ── 요약(타일) 묶음 ──
   🔴 경보(.alerts)는 이 안에 두지 않는다. 이 묶음은 사람이 접을 수 있는데,
      접힌 채로 '감시 끊김'이 숨으면 이 도구가 존재하는 이유가 사라진다.
      접히는 것은 요약뿐이고, 경보는 언제나 보인다.
   높이 상한을 둬서 타일이 늘어도 세션·상세를 0 높이로 밀어내지 않는다. */
.top{flex:0 0 auto; max-height:30vh; overflow-y:auto}
.alerts-wrap{flex:0 0 auto; max-height:28vh; overflow-y:auto}

/* 접기 화살표 — 상태를 글자로도 말한다(화살표 모양만으로 말하지 않는다) */
.arrow{display:inline-flex; align-items:center; gap:5px}
.arrow .chev{display:inline-block; width:9px; font-size:10px; line-height:1; color:var(--ink-2)}

/* ── 머리 ── */
header{
  flex:0 0 auto; background:var(--surface);
  border-bottom:1px solid var(--grid); padding:10px 16px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
h1{font-size:15px; font-weight:600; margin:0; letter-spacing:-.01em}
h1 small{color:var(--muted); font-weight:400; margin-left:8px}
.spacer{flex:1}
.live{display:inline-flex; align-items:center; gap:6px; color:var(--ink-2); font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 2px var(--surface)}
.dot.stale{background:var(--warn)}
.dot.off{background:var(--muted)}

button{
  font:inherit; font-size:13px; color:var(--ink); background:var(--surface-2);
  border:1px solid var(--ring); border-radius:6px; padding:5px 11px; cursor:pointer;
}
button:hover:not(:disabled){border-color:var(--base)}
button:disabled{opacity:.45; cursor:not-allowed}
button.primary{background:var(--accent); border-color:var(--accent); color:#fff}
button.danger{color:var(--crit); border-color:var(--ring)}
button.sm{padding:3px 8px; font-size:12px}

/* ── 경보 배너 ──
   Windows 풍선 알림을 걷어내고 알림을 여기로 옮겼다. 화면 맨 위에 두는 이유는
   사람이 창을 열었을 때 가장 먼저 보이는 자리이기 때문이다. 색만으로 말하지 않고
   수준 라벨과 아이콘을 함께 적는다. */
.alerts{padding:12px 16px 0; display:flex; flex-direction:column; gap:7px}
.alert{
  display:flex; align-items:flex-start; gap:9px; padding:9px 12px;
  border:1px solid var(--ring); border-radius:8px; background:var(--surface);
  border-left-width:3px;
}
.alert.critical{border-left-color:var(--crit)}
.alert.warning{border-left-color:var(--warn)}
.alert.info{border-left-color:var(--muted)}
.alert .ic{font-size:13px; line-height:1.35}
.alert.critical .ic{color:var(--crit)}
.alert.warning .ic{color:var(--warn)}
.alert.info .ic{color:var(--muted)}
.alert .txt{flex:1; min-width:0}
.alert .t{font-weight:600; font-size:13px}
.alert .d{color:var(--ink-2); font-size:12.5px; margin-top:2px; word-break:break-word}
.alert .lv{
  font-size:10.5px; font-weight:600; letter-spacing:.04em; color:var(--muted);
  border:1px solid var(--ring); border-radius:4px; padding:1px 5px; white-space:nowrap;
}

/* ── 요약 ──
   🔴 왜 묶음으로 바꿨나
     처음에는 큰 카드 10장이었고(190px · 값 21px · 설명 여러 줄) 네 줄을 차지해
     정작 일하는 곳인 세션 목록·상세를 아래로 밀었다. 그래서 카드를 작게 줄였는데,
     이번엔 **10장이 다 똑같이 생겨서 한눈에 안 들어왔다** — 계정 얘기와 OS 예약
     얘기가 같은 무게로 나란히 있으면 어디를 봐야 할지 알 수 없다.
     낱장을 줄이는 문제가 아니라 **묶는** 문제였다.

     네 묶음으로 나눈다(계정 · 실행 중 · 사용량 · OS 트리거). 묶음 안은 카드가
     아니라 `이름 — 값` 줄이다. 값은 오른쪽에 모아 세로로 훑을 수 있게 한다.
     자세한 설명은 title 로 남긴다 — 정보를 버리는 것이 아니라 접어두는 것이다. */
.groups{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:8px; padding:8px 16px}
.grp{
  background:var(--surface); border:1px solid var(--grid); border-radius:8px;
  padding:7px 11px 8px; min-width:0;
}
.grp > h3{
  font-size:10px; font-weight:700; letter-spacing:.07em; color:var(--muted);
  margin:0 0 4px; padding-bottom:4px; border-bottom:1px solid var(--grid);
}

/* ── 묶음 안의 한 항목 ──
   🔴 두 줄이다: `이름 — 값` 그리고 **보이는 세부**.
     한때 세부를 title(hover) 로만 남겼더니 "너무 심플하다"는 말을 들었다 —
     맞다. 근거를 감춘 요약은 숫자만 던지는 것과 같고, 이 화면은 무엇이 잘못됐는지
     판단하는 자리다. 세부는 보여야 한다.
     대신 세 줄에서 멈춘다(line-clamp) — 창이 여러 개인 VS Code 처럼 긴 것도 있어
     상한이 없으면 요약이 다시 화면을 먹는다. 넘치는 부분은 title 에 남는다. */
.grow{padding:3px 0; min-width:0}
.grow + .grow{border-top:1px solid var(--grid)}
.gtop{display:flex; align-items:baseline; gap:8px; min-width:0}
.gtop > .k{color:var(--ink-2); font-size:11.5px; white-space:nowrap}
.gtop > .v{
  flex:1; min-width:0; font-size:13px; font-weight:600; text-align:right;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
/* 상태는 색만으로 말하지 않는다 — 배지가 아이콘+라벨을 함께 나른다 */
.gtop > .v .badge{font-size:11px; padding:1px 6px; vertical-align:baseline}
.gd{
  color:var(--muted); font-size:11px; line-height:1.45; margin-top:1px;
  /* 줄바꿈이 있는 세부(창 목록 등)를 그대로 보여준다 */
  white-space:pre-line; word-break:break-word;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
}

/* ── 요약 머리 띠 = 접기 단추 ──
   화살표를 머리말 구석에 두었더니 눈에 띄지 않았다. 무엇을 접는지 옆에 적힌
   띠 자체를 단추로 만든다. 접으면 이 띠만 남아 되돌릴 길이 늘 보인다. */
.sumbar{
  width:100%; display:flex; align-items:center; gap:8px; text-align:left;
  background:var(--surface-2); border:0; border-bottom:1px solid var(--grid);
  border-radius:0; padding:6px 16px; color:var(--ink-2); font-size:11.5px;
}
.sumbar:hover{background:var(--surface)}
.sumbar .chev{display:inline-block; width:9px; font-size:10px; color:var(--ink-2)}
.sumbar .nm{font-weight:600}
/* 접었을 때만 한 줄 요지를 보여준다 — 접었다고 아무것도 모르면 안 된다 */
.sumdigest{
  flex:1; min-width:0; color:var(--muted); font-size:11.5px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.sumbar[aria-expanded="true"] .sumdigest{display:none}

/* ── 상태 배지: 아이콘 + 라벨 + 색 ── */
.badge{
  display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:500;
  padding:2px 8px; border-radius:999px; border:1px solid var(--ring); background:var(--surface-2);
  white-space:nowrap;
}
.badge .ic{font-size:11px; line-height:1}
.badge.good{color:var(--good-ink)} .badge.good .ic{color:var(--good)}
.badge.warn .ic{color:var(--warn)}
.badge.serious .ic{color:var(--serious)}
.badge.crit{color:var(--crit)} .badge.crit .ic{color:var(--crit)}
.badge.off{color:var(--muted)}

/* ── 계량기 ── */
.meter{height:6px; border-radius:3px; background:var(--accent-track); overflow:hidden; margin-top:6px}
.meter > i{display:block; height:100%; background:var(--accent); border-radius:3px}
.meter.warn > i{background:var(--warn)} .meter.crit > i{background:var(--crit)}

/* ── 본문 2단 ──
   align-items:stretch 로 두 패널이 같은 높이를 갖고, 각자 안에서 스크롤한다. */
main{
  flex:1 1 auto; min-height:0;
  display:grid; grid-template-columns:minmax(420px,1.05fr) minmax(460px,1.35fr);
  gap:12px; padding:0 16px 16px; align-items:stretch;
}
.panel{
  background:var(--surface); border:1px solid var(--grid); border-radius:9px;
  overflow:hidden;
  /* 🔴 min-height:0 이 없으면 flex 자식이 내용 높이만큼 부풀어 스크롤이 생기지 않는다 */
  display:flex; flex-direction:column; min-height:0;
}
.panel > h2{
  flex:0 0 auto;
  font-size:12.5px; font-weight:600; color:var(--ink-2); margin:0;
  padding:9px 13px; border-bottom:1px solid var(--grid); background:var(--surface-2);
  display:flex; align-items:center; gap:9px; flex-wrap:wrap;
}
.panel > h2 .spacer{flex:1}
.pad{padding:12px 13px}

/* 각 패널의 스크롤 영역 — 이 둘이 서로 독립으로 움직인다 */
#slist, #dscroll{flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain}

/* 좁은 화면에서는 두 패널이 세로로 쌓인다. 그때 각자 스크롤을 주면 둘 다 너무 낮아
   쓸 수 없으므로, 페이지 스크롤로 되돌리고 패널에는 넉넉한 상한만 준다. */
@media (max-width:1100px){
  body{overflow:auto}
  main{grid-template-columns:1fr; align-items:start}
  .top, .alerts-wrap{max-height:none; overflow:visible}
  #slist, #dscroll{max-height:70vh}
}

/* ── 선택 작업 바 ── */
/* flex:0 0 auto — 목록이 길어져도 이 줄이 눌리면 안 된다 */
.actions{flex:0 0 auto; display:flex; gap:7px; align-items:center; flex-wrap:wrap; padding:9px 13px; border-bottom:1px solid var(--grid)}
.actions .n{color:var(--ink-2); font-size:12px; margin-right:3px}
.filter{font-weight:400; color:var(--muted); font-size:11.5px}
.filter input{vertical-align:-2px}

/* ── 열린 폴더 (VS Code 워크스페이스) ── */
/* 폴더가 많아도 세션 목록을 밀어내지 않게 자체 상한을 둔다 */
.folders{
  flex:0 0 auto; max-height:26vh; overflow-y:auto;
  padding:8px 13px; border-bottom:1px solid var(--grid); background:var(--surface-2);
}
.frow{display:flex; align-items:center; gap:7px; flex-wrap:wrap; padding:3px 0}
.fname{
  font-family:ui-monospace,Consolas,monospace; font-size:11.5px; color:var(--ink-2);
  min-width:150px; word-break:break-all;
}

/* ── 세션 목록 ── */
.srow{display:grid; grid-template-columns:22px 1fr; gap:9px; padding:10px 13px; border-bottom:1px solid var(--grid); cursor:pointer}
.srow:last-child{border-bottom:0}
.srow:hover{background:var(--surface-2)}
.srow.sel{background:var(--surface-2); box-shadow:inset 3px 0 0 var(--accent)}
.srow input{margin-top:3px; width:15px; height:15px; accent-color:var(--accent); cursor:pointer}
.stitle{font-weight:500; display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.smeta{color:var(--muted); font-size:11.5px; margin-top:3px; display:flex; gap:9px; flex-wrap:wrap}
.smeta b{color:var(--ink-2); font-weight:500}
.sbadges{display:flex; gap:5px; margin-top:6px; flex-wrap:wrap}
code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:11.5px}
.path{color:var(--muted); font-family:ui-monospace,Consolas,monospace; font-size:11px; word-break:break-all}

/* ── 짝 없는 프로세스 (세션 행이 없는 claude.exe) ── */
.orphan-hd{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding:8px 13px; border-top:1px solid var(--grid); background:var(--surface-2);
  color:var(--muted); font-size:11.5px;
}
.orow{padding:8px 13px; border-bottom:1px solid var(--grid)}
.orow:last-child{border-bottom:0}

/* ── 상세 ── */
.kv{display:grid; grid-template-columns:96px 1fr; gap:4px 11px; font-size:12.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0; color:var(--ink-2); word-break:break-word}
.tabs{display:flex; gap:2px; padding:0 13px; border-bottom:1px solid var(--grid); background:var(--surface-2)}
.tabs button{
  background:none; border:0; border-bottom:2px solid transparent; border-radius:0;
  padding:8px 11px; color:var(--muted); font-size:12.5px;
}
.tabs button.on{color:var(--ink); border-bottom-color:var(--accent); font-weight:500}

/* 타임라인 — 자체 스크롤을 주지 않는다. 바깥 #dscroll 하나로 굴린다.
   스크롤 안에 스크롤이 있으면 휠이 어디로 갈지 예측할 수 없다. */
.tl{padding:4px 0}
.ti{padding:8px 13px; border-bottom:1px solid var(--grid)}
.ti:last-child{border-bottom:0}
.ti .hd{display:flex; gap:8px; align-items:baseline; font-size:11.5px; color:var(--muted)}
.ti .who{font-weight:600; font-size:12px}
.ti.user .who{color:var(--accent)}
.ti.asst .who{color:var(--ink)}
.ti.tool .who{color:var(--muted)}
.ti .body{margin-top:4px; font-size:12.5px; color:var(--ink-2); white-space:pre-wrap; word-break:break-word}
.ti .tools{margin-top:5px; display:flex; flex-direction:column; gap:3px}
.tchip{
  display:inline-flex; gap:6px; align-items:baseline; font-size:11.5px;
  background:var(--surface-2); border:1px solid var(--ring); border-radius:5px; padding:3px 7px;
}
.tchip b{font-weight:600; color:var(--ink)}
.tchip span{color:var(--muted); font-family:ui-monospace,Consolas,monospace; word-break:break-all}
.tok{color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums}

/* 로그 — 위와 같은 이유로 자체 스크롤 없음 */
pre.log{
  margin:0; padding:11px 13px;
  background:var(--surface); color:var(--ink-2);
  font-family:ui-monospace,Consolas,monospace; font-size:11.5px; line-height:1.55;
  white-space:pre-wrap; word-break:break-word;
}
.empty{color:var(--muted); padding:22px 13px; text-align:center; font-size:12.5px}
textarea{
  width:100%; font:inherit; font-size:12.5px; background:var(--surface-2); color:var(--ink);
  border:1px solid var(--ring); border-radius:6px; padding:8px; min-height:74px; resize:vertical;
}
.note{color:var(--muted); font-size:11.5px; margin-top:5px; line-height:1.5}
.warnbox{
  border:1px solid var(--ring); border-left:3px solid var(--warn);
  background:var(--surface-2); padding:9px 11px; border-radius:6px; font-size:12.5px; color:var(--ink-2);
}
table.models{width:100%; border-collapse:collapse; font-size:12px; font-variant-numeric:tabular-nums}
table.models th{text-align:right; color:var(--muted); font-weight:500; padding:3px 6px; border-bottom:1px solid var(--grid)}
table.models th:first-child{text-align:left}
table.models td{text-align:right; padding:3px 6px; border-bottom:1px solid var(--grid); color:var(--ink-2)}
table.models td:first-child{text-align:left; color:var(--ink)}
</style>
</head>
<body>

<header>
  <h1>RetrySession <small id="acct">계정 확인 중…</small></h1>
  <div class="spacer"></div>
  <span class="live"><i class="dot off" id="dot"></i><span id="freshness">연결 중…</span></span>
  <button type="button" class="sm" id="btnAuto">자동갱신 켬</button>
  <button type="button" class="sm" id="btnRefresh">지금 갱신</button>
  <button type="button" class="sm" id="btnTheme">밝게</button>
</header>

<!-- 🔴 경보는 접히는 묶음 바깥이다. 접은 채로 '감시 끊김'이 숨으면 안 된다. -->
<div class="alerts-wrap">
  <section id="alerts" class="alerts hide"></section>
</div>

<!-- 요약 열 개 항목을 한 묶음으로. 머리 띠가 곧 숨김/표시 단추다. -->
<button type="button" class="sumbar" id="btnTop" aria-expanded="true" aria-controls="top"
        title="요약을 접으면 세션과 상세가 넓어집니다">
  <span class="chev" id="btnTopIc" aria-hidden="true">▾</span>
  <span class="nm" id="btnTopTx">요약 접기</span>
  <span class="sumdigest" id="sumdigest"></span>
</button>

<div class="top" id="top">
  <section class="groups" id="tiles"></section>
</div>

<main>
  <section class="panel">
    <h2>세션 <span id="scount" class="badge off"><span class="ic">●</span>—</span>
      <span class="spacer"></span>
      <label class="filter">
        <input type="checkbox" id="onlyReg"> 등록된 것만
      </label>
    </h2>
    <div class="actions">
      <span class="n" id="selN">0개 선택</span>
      <button type="button" class="sm primary" data-act="watch-on">감시 시작</button>
      <button type="button" class="sm" data-act="watch-off">감시 중지</button>
      <button type="button" class="sm primary" data-act="resume-on">재시작 시작</button>
      <button type="button" class="sm" data-act="resume-off">재시작 중지</button>
      <button type="button" class="sm" data-act="rearm">차단 해제</button>
      <button type="button" class="sm danger" data-act="remove">등록 해제</button>
    </div>
    <div id="folders" class="folders hide"></div>
    <div id="slist"></div>
  </section>

  <section class="panel" id="detail">
    <h2 id="dtitle">상세 — 왼쪽에서 세션을 고르세요</h2>
    <div class="tabs" id="dtabs">
      <button type="button" data-tab="now" class="on">처리 상황</button>
      <button type="button" data-tab="tl">대화·도구</button>
      <button type="button" data-tab="hb">감시 로그</button>
      <button type="button" data-tab="rs">재시작 로그</button>
      <button type="button" data-tab="cfg">설정</button>
      <button type="button" data-tab="al">알림</button>
    </div>
    <!-- 상세 전용 스크롤 영역. 세션 목록(#slist)과 독립으로 움직인다. -->
    <div id="dscroll">
      <div class="empty" id="dempty">세션 행을 누르면 처리 상황과 내용이 실시간으로 표시됩니다.</div>
      <div id="dbody" class="hide">
        <div id="tab-now" class="pad"></div>
        <div id="tab-tl" class="tl hide"></div>
        <pre id="tab-hb" class="log hide"></pre>
        <pre id="tab-rs" class="log hide"></pre>
        <div id="tab-cfg" class="pad hide"></div>
      </div>
      <!-- 알림은 세션을 고르지 않아도 볼 수 있어야 한다 — dbody 바깥에 둔다 -->
      <pre id="tab-al" class="log hide"></pre>
    </div>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
